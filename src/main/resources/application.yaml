spring:
  application:
    name: libraryapi
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5439/library}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
#      ddl-auto: update
      ddl-auto: none
    properties:
      hibernate.format_sql: true

